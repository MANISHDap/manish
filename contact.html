<!DOCTYPE html>

<body>
  <header class="page-header">
    <p class="eyebrow">GET IN TOUCH</p>
    <h1>Contact Me</h1>
    <p>Have a question or want to connect? Send me a message.</p>
  </header>
  <nav>
    <a href="index.html">Home</a>
    <a href="resume.html">Resume</a>
    <a href="biodata.html">Bio-data</a>
    <a class="active" href="contact.html">Contact</a>
  </nav>

  <main class="contact-layout">
    <section class="content-card contact-form-card">
      <h2>Send a Message</h2>
      <form id="contactForm">
        <label for="name">Your Name</label>
        <input type="text" id="name" name="name" placeholder="Enter your name" required>

        <label for="email">Your Email</label>
        <input type="email" id="email" name="email" placeholder="Enter your email" required>

        <label for="message">Message</label>
        <textarea id="message" name="message" rows="5" placeholder="Write your message here..." required></textarea>

        <button class="button" type="submit">Prepare Email</button>
      </form>
      <p id="result" class="form-result" aria-live="polite"></p>
    </section>

    <aside class="content-card contact-info">
      <p class="eyebrow">CONTACT DETAILS</p>
      <h2>Let's connect.</h2>
      <div class="contact-detail"><span>Email</span><a href="mailto:dpmanish148@gmail.com">dpmanish148@gmail.com</a></div>
      <div class="contact-detail"><span>Location</span><p>Belthangady, Dakshina Kannada, Karnataka</p></div>
    </aside>
  </main>

  <footer><p>© 2026 Manish D P <span>•</span> Contact</p></footer>
  <script src="js/script.js"></script>
</body>
